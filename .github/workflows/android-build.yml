name: Build Custom 2v2 Ludo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CustomLudoAndroidProject.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o CustomLudoAndroidProject.zip

      - name: Build debug APK
        working-directory: CustomLudoAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-2v2-Ludo-APK
          path: CustomLudoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
